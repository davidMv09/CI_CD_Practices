name: CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_rota:
        description: "Laboratorio: desplegar una versión que no arranca en producción"
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  CI:
    permissions:
      contents: read
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements*.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate build
        run: |
          python -m compileall -q app
          python -c "from app import create_app; create_app()"

      - name: Run tests
        run: |
          bash scripts/pruebas.sh

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: reports/
          if-no-files-found: error
  empaquetar:
    permissions:
      contents: read
      packages: write
    name: Empaquetar imagen
    needs: CI
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@v7
      - name: Calcular nombre de la imagen
        id: nombre
        env:
          ROTA: ${{ inputs.version_rota }}
        # GHCR exige minúsculas; ${VAR,,} las convierte en Bash.
        # La versión rota lleva otra etiqueta: nunca pisa la imagen buena de un SHA.
        run: |
          ETIQUETA="$GITHUB_SHA"
          if [ "$ROTA" = "true" ]; then ETIQUETA="rota-$GITHUB_RUN_ID"; fi
          echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}:$ETIQUETA" >> "$GITHUB_OUTPUT"
      - name: "Solo para el laboratorio: romper la versión"
        if: inputs.version_rota
        # Agrega una línea a app/__init__.py: la API no arranca en producción.
        # Staging no cambia.
        run: |
          sed -i '/^    cfg = config or Config.desde_entorno()$/a\
              if cfg.ambiente == "production": raise RuntimeError("Version rota")' app/__init__.py
          if git diff --quiet; then echo "No se pudo romper la versión"; exit 1; fi
          git diff
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Construir imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: |
          docker build \
            --build-arg APP_VERSION="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$IMAGEN" .
          docker image ls "$IMAGEN"
      - name: Publicar imagen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
        run: docker push "$IMAGEN"

  staging:
    permissions:
      contents: read
      packages: read
    name: Desplegar en staging
    needs: empaquetar
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
          APP_ENV: ${{ vars.APP_ENV || 'staging' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV -e API_TOKEN "$IMAGEN"
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
      - name: Ver el arranque del contenedor
        run: docker logs api

  production:
    permissions:
      contents: read
      packages: read
    name: Desplegar en producción
    needs: [empaquetar, staging]
    runs-on: ubuntu-latest
    # El environment "production" tiene un revisor obligatorio: el job espera la aprobación.
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar contenedor
        env:
          IMAGEN: ${{ needs.empaquetar.outputs.imagen }}
          APP_ENV: ${{ vars.APP_ENV || 'staging' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV -e API_TOKEN "$IMAGEN"
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080
      - name: Ver el arranque del contenedor
        run: docker logs api

  rollback:
    name: Rollback automático en producción
    needs: production
    # Solo si falló producción. Si falló antes (por ejemplo staging), producción nunca cambió.
    if: failure() && needs.production.result == 'failure'
    runs-on: ubuntu-latest
    # Para leer APP_ENV y API_TOKEN de production.
    # Como production tiene revisor, este job también espera la aprobación.
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Buscar el último SHA que pasó producción
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh run list --workflow ci-cd.yml --branch main --status success \
                --limit 1 --json headSha --jq '.[0].headSha')
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "No hay una versión buena anterior"; exit 1; }
          echo "Se vuelve a $SHA"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}:$SHA" >> "$GITHUB_ENV"
      - name: Iniciar sesión en GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Desplegar la versión anterior
        env:
          APP_ENV: ${{ vars.APP_ENV || 'production' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: docker run -d --name api -p 8080:8000 -e APP_ENV -e API_TOKEN "$IMAGEN"
      - name: Smoke test
        run: |
          bash scripts/smoke.sh http://localhost:8080
          curl -fsS http://localhost:8080/version | grep -q "$SHA"
          echo "OK producción volvió a $SHA"
      - name: Ver el arranque del contenedor
        run: docker logs api
