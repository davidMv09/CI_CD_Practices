on:
  push:
  pull_request_target:

permissions:
  contents: read

jobs:
  desplegar:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Depurar configuración
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          set -x
          echo "Token del registro: $TOKEN"
          echo "Token de la API (codificado): $(echo -n "$API_TOKEN" | base64)"
          env

      - name: Anunciar el cambio
        run: |
          echo "Desplegando el cambio: ${{ github.event.pull_request.title }}"

      - name: Construir imagen
        run: docker build -t api-tareas:latest .

      - name: Desplegar
        run: docker run -d -p 8080:8000 --env-file .env api-tareas:latest